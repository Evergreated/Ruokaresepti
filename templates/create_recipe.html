
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Lisää resepti</title>
</head>
<body>
    <h1>Lisää uusi resepti</h1>

    <form action="{{ url_for('create_recipe') }}" method="post">
        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token }}">

        <p>
            <label for="title">Reseptin nimi:</label>
            <input type="text" id="title" name="title"
                   maxlength="100" required>
        </p>

        <p>
            <label for="ingredients">Ainekset:</label>
            <textarea id="ingredients" name="ingredients"
                      rows="8" maxlength="5000" required></textarea>
        </p>

        <p>
            <label for="instructions">Valmistusohje:</label>
            <textarea id="instructions" name="instructions"
                      rows="10" maxlength="10000" required></textarea>
        </p>

        <button type="submit">Tallenna resepti</button>
    </form>

    <p><a href="{{ url_for('index') }}">Takaisin etusivulle</a></p>
</body>
</html>
